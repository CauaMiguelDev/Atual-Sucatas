# Atual Sucatas — site estático (HTML/CSS/JS), sem etapa de build.
# O Netlify publica a raiz do repositório, igual ao GitHub Pages.
[build]
  command = ""
  publish = "."

# Funções que guardam os pedidos num lugar só, visível em todos os aparelhos
# (Netlify Blobs). Sem servidor próprio e de graça no volume da loja.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# A raiz abre o site da loja (no GitHub Pages o index.html da raiz faz o mesmo).
[[redirects]]
  from = "/"
  to = "/site/"
  status = 302
  force = true

# Painel e área do administrador ficam fora dos buscadores.
[[headers]]
  for = "/painel/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
